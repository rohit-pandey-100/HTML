<!-- example on "form" tag -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>My 24th Web page</title>
    <link rel="icon" href="logo.png">
</head>

<body>
    <h2>demo on html forms</h2>

    <form id="frm" action="https://www.abcd.com/register" method="get">
        <label>Fullname</label> <br>
        <input type="text" placeholder="Fullname" id="fna" name="fna">
        <br>
        <label>EmailId</label> <br>
        <input type="text" placeholder="Emailid" id="em" name="em">
        <br>
        <input type="submit" id="sb" name="sb">
    </form>
    <hr>
    <form id="frm" action="https://www.abcd.com/login" method="post">

        <label>enter username</label> <br>
        <input type="text" placeholder="Username" id="una" name="una">
        <br>
        <label>enter password</label> <br>
        <input type="password" placeholder="Password" id="pw" name="pw">
        <br>
        <input type="submit" value="Log In" id="sb" name="sb">
    </form>
</body>

</html>
