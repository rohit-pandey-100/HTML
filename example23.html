<!-- example on "input" tag -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>My 23th Web page</title>
    <link rel="icon" href="logo.png">
</head>

<body>
    <h2>demo on input elements</h2>

    <!-- reset =>  app forms  -->
    <input type="reset" value="Clear All">
    <br>

    <!-- submit => app forms	-->
    <input type="submit" value="Log In" />
    <br>
    <input type="image" src="/img/img2.webp" />
    <br>

    <!-- button => js code execution  -->
    <input type="button" value="addition" />

</body>

</html>
<!--
Note:
1.Reset button and input elements should be placed within same form tag.
2.When submitting the data every input element Mass contains ID and name.
-->
