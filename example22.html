<!-- example on "input" tag -->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>My 22th Web page</title>
    <link rel="icon" href="logo.png">
</head>

<body>
    <h2>demo on input elements</h2>

    <input /> <!-- by default textbox -->
    <input type="fish" /> <!-- textbox -->
    <br>
    <!-- text field => firstname, lastname, fullname, father name, mothername, address, pancard, regno ... -->
    <input type="text" size="50" />
    <br>

    <!-- password field => password, card pin, verification code, cvv, passcode ...  -->
    <input type="password" />
    <br>

    <!-- number field => phone, age, marks, pincode, card nums, amount, qty ... -->
    <input type="number" step="5" min="18" max="100" />
    <br>

    <!-- checkbox =>  t&c, fillters -->
    <input type="checkbox" checked style="accent-color:blue;" />

    <!-- radio button => gender, mcqs, marital status ... 	-->
    <input type="radio" checked style="accent-color:blue;" />
    <br>

    <!-- file uploading => resume, kyc, email ... -->
    <!-- <input type="file" />  
	<input type="file" multiple /> -->
    <input type="file" accept=".pdf,.docx" />

</body>

</html>
